<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Placa do vidro - Corrêa Veículos</title>
  <link rel="icon" href="img/icone.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Anton&family=Archivo:wght@700;900&display=swap" rel="stylesheet">
  <style>
    :root { --azul: #1f3a5f; --borda: #d9dde3; --suave: #5f6670; }
    * { box-sizing: border-box; }
    body { margin: 0; font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; background: #e9ebee; color: #1c1f24; }
    .tela { display: grid; grid-template-columns: 340px 1fr; min-height: 100vh; }
    .painel { background: #fff; border-right: 1px solid var(--borda); padding: 18px; overflow-y: auto; max-height: 100vh; position: sticky; top: 0; }
    .painel h1 { font-size: 1.15rem; margin: 0 0 4px; }
    .painel p { color: var(--suave); font-size: .85rem; margin: 0 0 14px; }
    .campo { display: flex; flex-direction: column; gap: 4px; margin-bottom: 12px; font-size: .85rem; }
    .campo span { color: var(--suave); }
    input, select { font: inherit; padding: 9px 10px; border: 1px solid var(--borda); border-radius: 8px; width: 100%; }
    .opcionais { display: grid; grid-template-columns: 1fr 1fr; gap: 6px 10px; font-size: .82rem; margin: 6px 0 14px; }
    .opcionais label { display: flex; gap: 6px; align-items: center; }
    .opcionais input { width: auto; }
    .acoes { display: grid; gap: 8px; position: sticky; bottom: -18px; background: #fff; padding: 12px 0; }
    button { font: 600 1rem system-ui, sans-serif; border: 0; border-radius: 8px; padding: 12px; cursor: pointer; background: var(--azul); color: #fff; }
    button.secundario { background: #fff; color: var(--azul); border: 1px solid var(--azul); }
    .aviso { font-size: .85rem; min-height: 1.2em; color: #1d7a46; }
    .aviso.erro { color: #b42318; }
    .previa { padding: 24px; display: flex; justify-content: center; align-items: flex-start; overflow: auto; }
    .escala { transform-origin: top center; }

    /* ---------- a placa (A4 em pé) ---------- */
    .folha { width: 210mm; height: 297mm; background: #fff; color: #000; padding: 8mm 9mm 7mm; display: flex; flex-direction: column;
      box-shadow: 0 2px 12px rgba(0,0,0,.18); border: 1.2mm solid #000; overflow: hidden; }
    .cab { display: grid; grid-template-columns: 1fr auto 1fr; align-items: center; gap: 4mm; height: 34mm; }
    .cab .barra { height: 9mm; background: #000; }
    .cab .barra.esq { clip-path: polygon(0 0, 100% 0, 92% 100%, 0 100%); }
    .cab .barra.dir { clip-path: polygon(8% 0, 100% 0, 100% 100%, 0 100%); }
    /* Logo colorido vira preto e branco; o fundo branco continua branco (multiply) */
    .cab img { height: 30mm; filter: grayscale(1) brightness(1.25) contrast(3); mix-blend-mode: multiply; clip-path: inset(4%); }
    .linha { border-top: .7mm solid #000; margin: 2mm 0; }
    .modelo { font-family: Anton, Impact, "Arial Narrow", sans-serif; text-transform: uppercase; text-align: center; line-height: .95;
      white-space: nowrap; font-size: 60mm; margin-top: 2mm; letter-spacing: -.5mm; }
    .versao { display: grid; grid-template-columns: 1fr auto 1fr; align-items: center; gap: 5mm; margin: 1mm 18mm 0; }
    .versao::before, .versao::after { content: ""; border-top: .8mm solid #000; }
    .versao span, .ano { font-family: "Archivo", Arial, sans-serif; font-weight: 900; text-transform: uppercase; text-align: center; white-space: nowrap; }
    .versao span { font-size: 15mm; line-height: 1.1; }
    .ano { font-size: 15mm; line-height: 1.05; }
    .destaque { background: #000; color: #fff; border-radius: 3mm; font-family: "Archivo", Arial, sans-serif; font-weight: 900; font-style: italic;
      text-transform: uppercase; text-align: center; font-size: 15mm; line-height: 1.25; margin: 2mm 4mm 3mm; white-space: nowrap; overflow: hidden; }
    .preco { border: .6mm solid #000; border-radius: 3mm; display: flex; align-items: flex-end; justify-content: center; padding: 1mm 4mm 2mm;
      font-family: Anton, Impact, sans-serif; font-style: italic; white-space: nowrap; }
    .preco .rs { font-size: 14mm; align-self: flex-start; margin-top: 4mm; margin-right: 2mm; }
    .preco .valor { font-size: 40mm; line-height: 1; letter-spacing: -1mm; }
    .preco .cent { font-size: 13mm; margin-left: 1mm; margin-bottom: 3mm; }
    .preco.consulta .valor { font-size: 26mm; }
    .opc { flex: 1; display: flex; justify-content: center; align-items: center; min-height: 0; }
    .opc .item { flex: 1; display: flex; flex-direction: column; align-items: center; gap: 2mm; font-family: "Archivo", Arial, sans-serif; font-weight: 900;
      text-transform: uppercase; text-align: center; font-size: 5mm; line-height: 1.1; padding: 0 2mm; }
    .opc .item + .item { border-left: .5mm solid #000; }
    .opc svg { width: 18mm; height: 18mm; }
    .contatos { display: grid; grid-template-columns: 1fr auto 1fr; align-items: center; gap: 3mm; padding: 1mm 0; }
    .contatos .sep { width: .5mm; height: 11mm; background: #000; }
    .contato { display: flex; align-items: center; justify-content: center; gap: 2.5mm; font-family: Anton, Impact, sans-serif; font-style: italic; font-size: 11mm; white-space: nowrap; }
    .contato small { font-size: 7mm; }
    .contato svg { width: 11mm; height: 11mm; flex-shrink: 0; }
    .endereco { display: flex; align-items: center; justify-content: center; gap: 3mm; font-family: "Archivo", Arial, sans-serif; font-weight: 900; text-transform: uppercase;
      text-align: center; font-size: 4.8mm; line-height: 1.25; }
    .endereco svg { width: 8mm; height: 10mm; flex-shrink: 0; }

    /* Impressoras não imprimem colado na borda: deixa 5 mm de margem e a placa ocupa o resto da folha A4 */
    @page { size: A4 portrait; margin: 5mm; }
    @media print {
      body { background: #fff; -webkit-print-color-adjust: exact; print-color-adjust: exact; }
      .painel { display: none; }
      .tela { display: block; min-height: 0; }
      .previa { padding: 0; display: block; overflow: visible; }
      .escala { transform: none !important; width: auto !important; height: auto !important; }
      .folha { box-shadow: none; width: 200mm; height: 286mm; page-break-inside: avoid; }
    }
    @media (max-width: 900px) {
      .tela { grid-template-columns: 1fr; }
      .painel { position: static; max-height: none; border-right: 0; border-bottom: 1px solid var(--borda); }
      .acoes { position: static; }
    }
  </style>
</head>
<body>
  <div class="tela">
    <form class="painel" id="form" novalidate>
      <h1>Placa do vidro (A4)</h1>
      <p id="carro">Carregando…</p>
      <label class="campo"><span>Modelo (letra grande)</span><input name="modelo" maxlength="30"></label>
      <label class="campo"><span>Versão</span><input name="versao" maxlength="40" placeholder="Ex.: LS"></label>
      <label class="campo"><span>Ano</span><input name="ano" maxlength="12" placeholder="Ex.: 2015 ou 2014/2015"></label>
      <label class="campo"><span>Faixa de destaque</span>
        <select name="destaque_opcao">
          <option value="">Sem faixa</option>
          <option>Único dono</option><option>Segundo dono</option><option>Cautelar aprovada</option><option>Baixa km</option>
          <option>Aceita troca</option><option>Financiamos</option><option>Revisado</option><option>Pneus novos</option>
          <option value="outro">Outro (escrever)</option>
        </select>
      </label>
      <label class="campo" id="campo-destaque-outro" hidden><span>Texto da faixa</span><input name="destaque_outro" maxlength="40"></label>
      <label class="campo"><span>Preço</span><input name="preco" inputmode="decimal" placeholder="Ex.: 46.900 (em branco: Consulte)"></label>
      <div class="campo"><span>Opcionais com ícone (até 4)</span></div>
      <div class="opcionais" id="opcionais"></div>
      <div class="aviso" id="aviso"></div>
      <div class="acoes">
        <button type="button" id="imprimir">Salvar e imprimir</button>
        <button type="button" id="salvar" class="secundario">Só salvar</button>
      </div>
    </form>
    <div class="previa"><div class="escala" id="escala"><div class="folha" id="folha"></div></div></div>
  </div>
  <script src="placa.js"></script>
</body>
</html>
