<!doctype html>
<html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex"><meta name="referrer" content="no-referrer"><meta name="theme-color" content="#1f3a5f"><title>Fotos do anúncio | Corrêa Veículos</title><link rel="icon" href="/img/icone.png"><link rel="stylesheet" href="/estilo.css"><style>
header{background:#fff;border-bottom:1px solid var(--borda);text-align:center;padding:12px}header img{height:60px;max-width:90%;object-fit:contain}main{max-width:520px;padding:24px 18px}h1{font-size:1.4rem}.destino{background:#fff;border:1px solid var(--borda);border-radius:10px;padding:16px;margin:20px 0;overflow-wrap:anywhere}.destino p{margin:8px 0 0}.escolha{display:flex;align-items:center;justify-content:center;gap:10px;background:var(--azul);color:white;border-radius:10px;padding:22px 14px;margin:12px 0;font-weight:700;cursor:pointer;min-height:68px}.escolha.secundaria{background:white;color:var(--azul);border:1px solid var(--azul)}.escolha:has(input:disabled){opacity:.5;cursor:wait}.escolha:focus-within{outline:3px solid #2676d9;outline-offset:3px}.escolha input{position:absolute;width:1px;height:1px;opacity:0}#lista-envios{list-style:none;padding:0;display:grid;gap:10px}#lista-envios li{border:1px solid var(--borda);background:white;border-radius:8px;padding:14px;font-size:.9rem}#lista-envios .ok{background:var(--verde-claro);border-color:#a7d5bd}#lista-envios .erro,#mensagem-fotos.erro{background:var(--vermelho-claro);color:var(--vermelho)}#mensagem-fotos{padding:14px;border-radius:8px;line-height:1.5}.nota{font-size:.8rem;color:var(--texto-suave);line-height:1.7}.envio-estado{font-size:.85rem;color:var(--texto-suave)}#lista-envios button{margin-top:10px}
</style></head><body><header><img src="/img/logo.jpg" alt="Corrêa Veículos"></header><main><h1>Fotos para o anúncio</h1><p class="suave">Escolha as fotos da galeria ou use a câmera.</p><p id="mensagem-fotos" role="status" aria-live="polite">Conectando ao anúncio…</p><div id="envio-pronto" hidden><section class="destino"><strong id="titulo-anuncio"></strong><p id="contagem-envio" class="envio-estado"></p></section><label class="escolha"><input id="camera-fotos" type="file" accept="image/*" capture="environment" disabled>Tirar foto</label><label class="escolha secundaria"><input id="galeria-fotos" type="file" accept="image/*" multiple disabled>Escolher fotos da galeria</label><p class="nota">As fotos vão para o anúncio no computador. Depois, confira a capa e salve por lá para mostrar no site. Não envie documentos pessoais.</p><p class="nota" id="validade-envio"></p></div><ul id="lista-envios" aria-live="polite"></ul></main><script src="/fotos-anuncio.js" defer></script></body></html>
